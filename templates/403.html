{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 — Access Denied | ClientSpace</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:ui-sans-serif,system-ui,sans-serif;background:#faf8f4;color:#4a3520;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
    .container{text-align:center;max-width:480px}
    .code{font-size:96px;font-weight:800;color:#d4a373;line-height:1}
    .title{font-size:24px;font-weight:700;margin-top:16px;color:#292521}
    .desc{margin-top:12px;font-size:14px;color:#8b6f55;line-height:1.7}
    .reason{margin-top:16px;padding:12px 16px;background:#fef3e2;border:1px solid #f5d49a;border-radius:8px;font-size:13px;color:#92400e}
    .btn{display:inline-block;margin-top:32px;padding:12px 28px;background:#d4a373;color:#fff;border-radius:8px;text-decoration:none;font-size:13px;font-weight:700;transition:background .2s}
    .btn:hover{background:#b8895e}
  </style>
</head>
<body>
<div class="container">
  <div class="code">403</div>
  <div class="title">Access Denied</div>
  <p class="desc">You are authenticated but do not have permission to access this page.</p>
  {% if reason %}
    <div class="reason">{{ reason }}</div>
  {% endif %}
  <a href="/" class="btn">← Back to Dashboard</a>
</div>
</body>
</html>
